name: Build and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 */6 * * *'   # refresh copied preview tags every 6 hours (UTC)
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Restore last good preview tags
        uses: actions/cache@v4
        with:
          path: .cache
          key: meta-${{ github.run_id }}
          restore-keys: meta-

      - run: node scripts/build.mjs

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
