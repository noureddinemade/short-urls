# Domain this site is served from (also written to the CNAME file).
domain: zhr.au

# Where the bare domain (https://zhr.au/) redirects.
root:
  url: https://noureddine.biz

# Short links. The key is the path: "gh" -> https://zhr.au/gh
#
# Only `url` is required. Preview details (title, description, image,
# site_name) are copied from the destination automatically. Set any of
# them here to override the copied value.
#
# Example:
#   gh:
#     url: https://github.com/yourname
#     title: My GitHub
#     image: https://example.com/preview.png
links:
  small-interactions:
    url: https://noureddinemade.substack.com/p/small-interactions
    title: Small Interactions
    description: The joy that lives in the process
    image: https://media.licdn.com/dms/image/sync/v2/D5627AQH7kRoCA5M5YA/articleshare-shrink_1280_800/B56aHsEno8HgAg-/0/1794961996981?e=1795572000&v=beta&t=hTUv8kIiaN0jicNjK2fRD3Qdj8KLdp_afPdXMxuiVUA
